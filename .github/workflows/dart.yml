name: Flutter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-core:
    # The C++ core must build and pass its own tests without Flutter: that is
    # the acceptance gate for every migration phase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/videoder_core -B build/native/videoder_core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native/videoder_core --parallel
      - name: Test
        run: ctest --test-dir build/native/videoder_core --output-on-failure
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build native core
        run: |
          cmake -S native/videoder_core -B build/native/videoder_core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/videoder_core --parallel
      - run: flutter test --reporter expanded --timeout 120s
        env:
          FFMPEG_TEST_PATH: /usr/bin/ffmpeg
          # The bridge tests load the real library through this override; without
          # it they would only exercise the "core unavailable" paths.
          VIDEODER_CORE_LIBRARY: ${{ github.workspace }}/build/native/videoder_core/libvideoder_core.so
