name: Flutter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-core:
    # The C++ core must build and pass its own tests without Flutter: that is
    # the acceptance gate for every migration phase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/videoder_core -B build/native/videoder_core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native/videoder_core --parallel
      - name: Test
        run: ctest --test-dir build/native/videoder_core --output-on-failure
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build native core
        run: |
          cmake -S native/videoder_core -B build/native/videoder_core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/videoder_core --parallel
      - run: flutter test --reporter expanded --timeout 120s
        env:
          FFMPEG_TEST_PATH: /usr/bin/ffmpeg
          # The bridge tests load the real library through this override; without
          # it they would only exercise the "core unavailable" paths.
          VIDEODER_CORE_LIBRARY: ${{ github.workspace }}/build/native/videoder_core/libvideoder_core.so
  macos-arm64:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Apple Silicon app
        run: |
          test "$(uname -m)" = arm64
          flutter config --enable-macos-desktop --enable-macos-arm64-only
          flutter pub get
          flutter build macos --release
      - name: Verify and package app
        run: |
          app="build/macos/Build/Products/Release/videoder_demo.app"
          test -d "$app"
          test -f "$app/Contents/Frameworks/libvideoder_core.dylib"
          lipo -verify_arch arm64 "$app/Contents/MacOS/videoder_demo"
          lipo -verify_arch arm64 "$app/Contents/Frameworks/libvideoder_core.dylib"
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          test -n "$version"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Videoder-v${version}-macos-arm64.zip"
          shasum -a 256 "dist/Videoder-v${version}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: videoder-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
